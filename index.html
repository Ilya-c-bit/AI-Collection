<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Мой ИИ-Хаб</title>
<style>
  :root { --bg: #0f1117; --card: #1a1d26; --text: #eceef2; --accent: #3b82f6; --border: #2d3240; }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; }
  header { padding: 10px 12px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
  .top-row { display: flex; justify-content: space-between; align-items: center; }
  h1 { margin: 0; font-size: 17px; }
  .btn-icon { background: #262b38; border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 8px; font-size: 13px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { white-space: nowrap; padding: 6px 12px; border-radius: 20px; background: #262b38; border: 1px solid var(--border); color: #a1a8b8; font-size: 13px; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  select, input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 13px; }
  #key-box { display: none; flex-direction: column; gap: 6px; margin-top: 2px; }
  #chat { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .assistant { align-self: flex-start; background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  footer { padding: 10px; background: var(--card); border-top: 1px solid var(--border); display: flex; gap: 8px; }
  textarea { flex: 1; resize: none; height: 42px; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; }
  #send { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 0 16px; font-weight: 600; font-size: 15px; }
</style>
</head>
<body>
<header>
  <div class="top-row">
    <h1>Личный ИИ-Хаб</h1>
    <div>
      <button class="btn-icon" onclick="toggleKey()">🔑 Ключи</button>
      <button class="btn-icon" onclick="clearChat()">🗑️</button>
    </div>
  </div>
  <div id="key-box">
    <input type="password" id="apiKey" placeholder="Ключ OpenRouter (sk-or-v1-...)" onchange="saveKeys()">
    <input type="password" id="ruKey" placeholder="Опционально: Ключ Яндекса / Сбера (для Алисы и ГигаЧата)" onchange="saveKeys()">
  </div>
  <div class="tabs" id="tabs"></div>
  <select id="version"></select>
</header>

<div id="chat"></div>

<footer>
  <textarea id="prompt" placeholder="Напишите запрос..."></textarea>
  <button id="send" onclick="sendMessage()">➤</button>
</footer>

<script>
const MODELS = {
  "DeepSeek": {
    "DeepSeek V4.1 Flash (Новейшая)": "deepseek/deepseek-v4.1-flash",
    "DeepSeek V4 Pro (Флагман)": "deepseek/deepseek-v4-pro",
    "DeepSeek V4 Flash": "deepseek/deepseek-v4-flash",
    "DeepSeek V3.2": "deepseek/deepseek-v3.2",
    "DeepSeek V3.1": "deepseek/deepseek-v3.1",
    "DeepSeek V3": "deepseek/deepseek-chat",
    "DeepSeek R1 (Рассуждающая)": "deepseek/deepseek-r1",
    "DeepSeek R1 Distill Llama 70B": "deepseek/deepseek-r1-distill-llama-70b",
    "DeepSeek V2.5 (Old)": "deepseek/deepseek-chat-v2.5"
  },
  "Бесплатные": {
    "Авто-выбор бесплатной (OpenRouter Free)": "openrouter/free",
    "NVIDIA Nemotron 3 Ultra (Free)": "nvidia/nemotron-3-ultra-550b-a55b:free",
    "Google Gemma 4 31B (Free)": "google/gemma-4-31b-it:free",
    "DeepSeek R1 (Free)": "deepseek/deepseek-r1:free"
  },
  "ChatGPT": {
    "GPT-6 Luna (Новейшая)": "openai/gpt-6-luna",
    "GPT-5 / o3": "openai/o3",
    "GPT-4.5 Preview": "openai/gpt-4.5-preview",
    "GPT-4o": "openai/gpt-4o",
    "GPT-4o Mini": "openai/gpt-4o-mini",
    "o3-mini": "openai/o3-mini",
    "o1 (Рассуждающая)": "openai/o1",
    "GPT-4 Turbo (Old)": "openai/gpt-4-turbo",
    "GPT-3.5 Turbo (Old)": "openai/gpt-3.5-turbo"
  },
  "ChatGPT Codex": {
    "GPT-5 Codex / Agent": "openai/codex-mini",
    "GPT-4o Code / Canvas": "openai/gpt-4o",
    "o3-mini High (Для кода)": "openai/o3-mini-high",
    "Qwen 2.5 Coder 32B (Open Codex)": "qwen/qwen-2.5-coder-32b-instruct"
  },
  "Claude": {
    "Claude Opus 5.5 (Новейшая)": "anthropic/claude-opus-5.5",
    "Claude Sonnet 4": "anthropic/claude-sonnet-4",
    "Claude Haiku 4.5": "anthropic/claude-haiku-4.5",
    "Claude 3.7 Sonnet": "anthropic/claude-3.7-sonnet",
    "Claude 3.5 Sonnet": "anthropic/claude-3.5-sonnet",
    "Claude 3 Opus (Old)": "anthropic/claude-3-opus",
    "Claude 3 Haiku (Old)": "anthropic/claude-3-haiku"
  },
  "Gemini": {
    "Gemini 3.8 Flash (Новейшая)": "google/gemini-3.8-flash",
    "Gemini 2.5 Pro": "google/gemini-2.5-pro",
    "Gemini 2.5 Flash": "google/gemini-2.5-flash",
    "Gemini 2.0 Flash": "google/gemini-2.0-flash-001",
    "Gemini Pro 1.5 (Old)": "google/gemini-pro-1.5"
  },
  "Grok": {
    "Grok 4.7 (Новейшая)": "x-ai/grok-4.7",
    "Grok-3": "x-ai/grok-3",
    "Grok-3 Mini": "x-ai/grok-3-mini",
    "Grok-2 (Old)": "x-ai/grok-2-1212"
  },
  "Qwen": {
    "Qwen 3 235B (Новейшая)": "qwen/qwen3-235b-a22b",
    "Qwen 3 32B": "qwen/qwen3-32b",
    "QwQ 32B (Рассуждающая)": "qwen/qwq-32b",
    "Qwen 2.5 72B": "qwen/qwen-2.5-72b-instruct",
    "Qwen 2 72B (Old)": "qwen/qwen-2-72b-instruct"
  },
  "Алиса AI / ГигаЧат": {
    "YandexGPT 5 Pro (Алиса AI)": "yandexgpt",
    "YandexGPT 4 Lite (Old)": "yandexgpt-lite",
    "GigaChat Max (Сбер)": "GigaChat-Max",
    "GigaChat Pro": "GigaChat-Pro",
    "GigaChat Lite (Old)": "GigaChat"
  }
};

let currentFamily = "DeepSeek";
let messages = [];
const tabsEl = document.getElementById("tabs");
const verSel = document.getElementById("version");
const keyInput = document.getElementById("apiKey");
const ruKeyInput = document.getElementById("ruKey");

keyInput.value = localStorage.getItem("or_key") || "";
ruKeyInput.value = localStorage.getItem("ru_key") || "";
if (!keyInput.value) document.getElementById("key-box").style.display = "flex";

function renderTabs() {
  tabsEl.innerHTML = "";
  Object.keys(MODELS).forEach(fam => {
    const btn = document.createElement("button");
    btn.className = "tab" + (fam === currentFamily ? " active" : "");
    btn.textContent = fam;
    btn.onclick = () => { currentFamily = fam; renderTabs(); updateVersions(); };
    tabsEl.appendChild(btn);
  });
}

function updateVersions() {
  verSel.innerHTML = "";
  const list = MODELS[currentFamily];
  Object.keys(list).forEach(v => verSel.add(new Option(v, list[v])));
}

renderTabs();
updateVersions();

function toggleKey() {
  const b = document.getElementById("key-box");
  b.style.display = b.style.display === "flex" ? "none" : "flex";
}
function saveKeys() {
  localStorage.setItem("or_key", keyInput.value.trim());
  localStorage.setItem("ru_key", ruKeyInput.value.trim());
}
function clearChat() { messages = []; document.getElementById("chat").innerHTML = ""; }

function addBubble(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  const chat = document.getElementById("chat");
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function sendMessage() {
  const promptEl = document.getElementById("prompt");
  const text = promptEl.value.trim();
  const key = keyInput.value.trim();
  const modelId = verSel.value;
  if (!text) return;

  if (currentFamily === "Алиса AI / ГигаЧат") {
    addBubble("user", text);
    promptEl.value = "";
    addBubble("assistant", "Для прямого вызова Алисы AI (Yandex Cloud) или ГигаЧата (SberDevices) нужен их облачный токен + Folder ID. Все остальные 8 вкладок работают напрямую по вашему ключу OpenRouter!");
    return;
  }

  if (!key) { alert("Нажмите '🔑 Ключи' вверху и вставьте API-ключ OpenRouter!"); toggleKey(); return; }

  promptEl.value = "";
  messages.push({ role: "user", content: text });
  addBubble("user", text);
  const botBubble = addBubble("assistant", "Думаю...");

  try {
    const res = await fetch("https://openrouter.ai", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + key,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ model: modelId, messages: messages })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
    const reply = data.choices[0].message.content;
    botBubble.textContent = reply;
    messages.push({ role: "assistant", content: reply });
  } catch (e) {
    botBubble.textContent = "Ошибка: " + e.message;
  }
}
</script>
</body>
</html>
