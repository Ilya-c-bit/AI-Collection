name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Android Project & Build APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          mkdir -p app/src/main/assets app/src/main/java/com/my/aihub
          cp index.html app/src/main/assets/index.html

          echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' > settings.gradle
          echo 'dependencyResolutionManagement { repositories { google(); mavenCentral() } }' >> settings.gradle
          echo 'rootProject.name = "MyAIHub"' >> settings.gradle
          echo 'include ":app"' >> settings.gradle

          echo 'plugins {' > build.gradle
          echo '    id "com.android.application" version "8.2.2" apply false' >> build.gradle
          echo '    id "org.jetbrains.kotlin.android" version "1.9.22" apply false' >> build.gradle
          echo '}' >> build.gradle

          echo 'org.gradle.jvmargs=-Xmx2048m' > gradle.properties

          echo 'plugins {' > app/build.gradle
          echo '    id "com.android.application"' >> app/build.gradle
          echo '    id "org.jetbrains.kotlin.android"' >> app/build.gradle
          echo '}' >> app/build.gradle
          echo 'android {' >> app/build.gradle
          echo '    namespace "com.my.aihub"' >> app/build.gradle
          echo '    compileSdk 34' >> app/build.gradle
          echo '    defaultConfig {' >> app/build.gradle
          echo '        applicationId "com.my.aihub"' >> app/build.gradle
          echo '        minSdk 24' >> app/build.gradle
          echo '        targetSdk 34' >> app/build.gradle
          echo '        versionCode 1' >> app/build.gradle
          echo '        versionName "1.0"' >> app/build.gradle
          echo '    }' >> app/build.gradle
          echo '    compileOptions {' >> app/build.gradle
          echo '        sourceCompatibility JavaVersion.VERSION_17' >> app/build.gradle
          echo '        targetCompatibility JavaVersion.VERSION_17' >> app/build.gradle
          echo '    }' >> app/build.gradle
          echo '    kotlinOptions { jvmTarget = "17" }' >> app/build.gradle
          echo '}' >> app/build.gradle

          echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/AndroidManifest.xml
          echo '<manifest xmlns:android="http://android.com">' >> app/src/main/AndroidManifest.xml
          echo '    <uses-permission android:name="android.permission.INTERNET" />' >> app/src/main/AndroidManifest.xml
          echo '    <application android:label="ИИ-Хаб" android:theme="@android:style/Theme.NoTitleBar" android:usesCleartextTraffic="true">' >> app/src/main/AndroidManifest.xml
          echo '        <activity android:name=".MainActivity" android:exported="true">' >> app/src/main/AndroidManifest.xml
          echo '            <intent-filter>' >> app/src/main/AndroidManifest.xml
          echo '                <action android:name="android.intent.action.MAIN" />' >> app/src/main/AndroidManifest.xml
          echo '                <category android:name="android.intent.category.LAUNCHER" />' >> app/src/main/AndroidManifest.xml
          echo '            </intent-filter>' >> app/src/main/AndroidManifest.xml
          echo '        </activity>' >> app/src/main/AndroidManifest.xml
          echo '    </application>' >> app/src/main/AndroidManifest.xml
          echo '</manifest>' >> app/src/main/AndroidManifest.xml

          echo 'package com.my.aihub' > app/src/main/java/com/my/aihub/MainActivity.kt
          echo 'import android.app.Activity' >> app/src/main/java/com/my/aihub/MainActivity.kt
          echo 'import android.os.Bundle' >> app/src/main/java/com/my/aihub/MainActivity.kt
          echo 'import android.webkit.WebView' >> app/src/main/java/com/my/aihub/MainActivity.kt
          echo 'import android.webkit.WebViewClient' >> app/src/main/java/com/my/aihub/MainActivity.kt
          echo 'class MainActivity : Activity() {' >> app/src/main/java/com/my/aihub/MainActivity.kt
          echo '    override fun onCreate(savedInstanceState: Bundle?) {' >> app/src/main/java/com/my/aihub/MainActivity.kt
          echo '        super.onCreate(savedInstanceState)' >> app/src/main/java/com/my/aihub/MainActivity.kt
          echo '        val webView = WebView(this)' >> app/src/main/java/com/my/aihub/MainActivity.kt
          echo '        webView.settings.javaScriptEnabled = true' >> app/src/main/java/com/my/aihub/MainActivity.kt
          echo '        webView.settings.domStorageEnabled = true' >> app/src/main/java/com/my/aihub/MainActivity.kt
          echo '        webView.webViewClient = WebViewClient()' >> app/src/main/java/com/my/aihub/MainActivity.kt
          echo '        webView.loadUrl("file:///android_asset/index.html")' >> app/src/main/java/com/my/aihub/MainActivity.kt
          echo '        setContentView(webView)' >> app/src/main/java/com/my/aihub/MainActivity.kt
          echo '    }' >> app/src/main/java/com/my/aihub/MainActivity.kt
          echo '}' >> app/src/main/java/com/my/aihub/MainActivity.kt

          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-AI-Hub-APK
          path: app/build/outputs/apk/debug/app-debug.apk
