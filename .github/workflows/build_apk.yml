name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK directly with Android SDK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          PLATFORM=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -n 1)/android.jar

          mkdir -p build/gen build/obj build/apk assets src/com/my/aihub
          cp index.html assets/index.html

          echo '<?xml version="1.0" encoding="utf-8"?>' > AndroidManifest.xml
          echo '<manifest xmlns:android="http://android.com" package="com.my.aihub" android:versionCode="1" android:versionName="1.0">' >> AndroidManifest.xml
          echo '    <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="34" />' >> AndroidManifest.xml
          echo '    <uses-permission android:name="android.permission.INTERNET" />' >> AndroidManifest.xml
          echo '    <application android:label="ИИ-Хаб" android:theme="@android:style/Theme.NoTitleBar" android:usesCleartextTraffic="true">' >> AndroidManifest.xml
          echo '        <activity android:name=".MainActivity" android:exported="true">' >> AndroidManifest.xml
          echo '            <intent-filter>' >> AndroidManifest.xml
          echo '                <action android:name="android.intent.action.MAIN" />' >> AndroidManifest.xml
          echo '                <category android:name="android.intent.category.LAUNCHER" />' >> AndroidManifest.xml
          echo '            </intent-filter>' >> AndroidManifest.xml
          echo '        </activity>' >> AndroidManifest.xml
          echo '    </application>' >> AndroidManifest.xml
          echo '</manifest>' >> AndroidManifest.xml

          echo 'package com.my.aihub;' > src/com/my/aihub/MainActivity.java
          echo 'import android.app.Activity;' >> src/com/my/aihub/MainActivity.java
          echo 'import android.os.Bundle;' >> src/com/my/aihub/MainActivity.java
          echo 'import android.webkit.WebView;' >> src/com/my/aihub/MainActivity.java
          echo 'import android.webkit.WebViewClient;' >> src/com/my/aihub/MainActivity.java
          echo 'public class MainActivity extends Activity {' >> src/com/my/aihub/MainActivity.java
          echo '    @Override protected void onCreate(Bundle savedInstanceState) {' >> src/com/my/aihub/MainActivity.java
          echo '        super.onCreate(savedInstanceState);' >> src/com/my/aihub/MainActivity.java
          echo '        WebView webView = new WebView(this);' >> src/com/my/aihub/MainActivity.java
          echo '        webView.getSettings().setJavaScriptEnabled(true);' >> src/com/my/aihub/MainActivity.java
          echo '        webView.getSettings().setDomStorageEnabled(true);' >> src/com/my/aihub/MainActivity.java
          echo '        webView.setWebViewClient(new WebViewClient());' >> src/com/my/aihub/MainActivity.java
          echo '        webView.loadUrl("file:///android_asset/index.html");' >> src/com/my/aihub/MainActivity.java
          echo '        setContentView(webView);' >> src/com/my/aihub/MainActivity.java
          echo '    }' >> src/com/my/aihub/MainActivity.java
          echo '}' >> src/com/my/aihub/MainActivity.java

          $BUILD_TOOLS/aapt package -f -m -J build/gen -S . -M AndroidManifest.xml -I $PLATFORM -A assets -F build/apk/unsigned.apk
          javac -source 1.8 -target 1.8 -bootclasspath $PLATFORM -classpath $PLATFORM -d build/obj src/com/my/aihub/MainActivity.java
          $BUILD_TOOLS/d8 --lib $PLATFORM --output build/apk build/obj/com/my/aihub/MainActivity.class
          cd build/apk && zip -u unsigned.apk classes.dex && cd ../..
          $BUILD_TOOLS/zipalign -f 4 build/apk/unsigned.apk build/apk/aligned.apk
          keytool -genkeypair -validity 10000 -dname "CN=AIHub" -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048
          $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out app-debug.apk build/apk/aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-AI-Hub-APK
          path: app-debug.apk
