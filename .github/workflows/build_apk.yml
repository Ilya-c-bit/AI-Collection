name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK directly with Android SDK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          PLATFORM=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -n 1)/android.jar

          mkdir -p res build/gen build/obj build/apk assets src/com/my/aihub
          cp index.html assets/index.html

          cat << 'EOF' > src/com/my/aihub/MainActivity.java
          package com.my.aihub;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }
          }
          EOF

          $BUILD_TOOLS/aapt package -f -m -J build/gen -S res -M AndroidManifest.xml -I $PLATFORM -A assets -F build/apk/unsigned.apk
          javac -source 1.8 -target 1.8 -bootclasspath $PLATFORM -classpath $PLATFORM -d build/obj src/com/my/aihub/MainActivity.java
          $BUILD_TOOLS/d8 --lib $PLATFORM --output build/apk build/obj/com/my/aihub/MainActivity.class
          cd build/apk && zip -u unsigned.apk classes.dex && cd ../..
          $BUILD_TOOLS/zipalign -f 4 build/apk/unsigned.apk build/apk/aligned.apk
          keytool -genkeypair -validity 10000 -dname "CN=AIHub" -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048
          $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out app-debug.apk build/apk/aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-AI-Hub-APK
          path: app-debug.apk
